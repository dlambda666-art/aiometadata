name: Sync to Hugging Face

# Envoie la branche dev sur le Space Lambda666/AIOMeta.
# `hf upload` gère les images (le push git direct de hub-sync était refusé
# par Hugging Face à cause des fichiers binaires).
on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Install Hugging Face CLI
        run: pip install -U huggingface_hub

      - name: Sync repository to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          hf upload \
            Lambda666/AIOMeta \
            . \
            --repo-type space \
            --exclude=".git*" \
            --exclude=".github*" \
            --delete="*" \
            --commit-message="Sync from GitHub"
